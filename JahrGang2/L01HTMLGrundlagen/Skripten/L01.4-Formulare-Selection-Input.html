<script src="slides/engine.js"></script>

<script>
const RAHMEN = [
    { sel: "body > header", name: "SiteHeader" },
    { sel: "#seiten-nav", name: "SideNav" },
    { sel: "#zusatz-info", name: "InfoBox" },
    { sel: "body > footer", name: "SiteFooter" }
];

SlideDeck.init({
    title: "L01.4 · Medien, Buttons & Formulare",
    subtitle: "figure, details, a vs. button, form, input, select",
    css: window.LERNPORTAL_CSS,
    tabs: [
        {
            id: "medien", label: "1 · Bild & Aufklappen", code: "code-medien",
            components: RAHMEN.concat([{ sel: "article", name: "NewsCard" }, { sel: "figure", name: "MediaFigure" }, { sel: "details", name: "Accordion" }]),
            url: "file:///lernportal/neuigkeiten.html",
            steps: [
                { base: true, title: "Ausgangspunkt: Die Neuigkeiten-Seite aus L01.3",
                  text: "Wir starten bei unserer Rubrik „Informatik & Technik“ mit zwei Beiträgen. Der erste Beitrag bekommt jetzt ein **Bild** und einen **aufklappbaren** Bereich." },
                { title: "<figure> und <img> – Bild als eigene Einheit",
                  text: "`<img>` kennen wir als Inline-Element ohne Closing-Tag. Mit `src` (Pfad) und `alt` (Beschreibung für Screenreader). Steht das Bild **für sich** – wie ein Foto in einer Zeitung – packen wir es in ein `<figure>`. `<figure>` ist ein Block." },
                { title: "<figcaption> – Die Bildunterschrift",
                  text: "`<figcaption>` ist die Bildunterschrift und gehört **in** das `<figure>`. Dadurch ist sie fest mit dem Bild verbunden – Bild und Text bilden zusammen **eine** Einheit." },
                { title: "<details> und <summary> – Aufklappen ohne JavaScript",
                  text: "`<details>` ist ein Bereich, der **zu- und aufgeklappt** werden kann. `<summary>` ist die immer sichtbare Zeile zum Anklicken. **Klicke rechts darauf!** Das funktioniert ganz ohne JavaScript." },
                { title: "Inhalt im <details>",
                  text: "Alles nach dem `<summary>` ist der versteckte Inhalt – hier eine Liste. Mit **HTML + CSS** (Taste `2`) siehst du, wie solche Aufklapp-Bereiche (*Akkordeon*) auf Webseiten meistens aussehen." }
            ]
        },
        {
            id: "buttons", label: "2 · a oder button?", code: "code-buttons",
            components: RAHMEN.concat([{ sel: "article", name: "NewsCard" }]),
            url: "file:///lernportal/neuigkeiten.html",
            steps: [
                { base: true, title: "Ausgangspunkt",
                  text: "Zwei Dinge sehen später gleich aus (ein Knopf), sind aber grundverschieden: **woanders hingehen** oder **etwas tun**. Wir entscheiden **nie nach dem Aussehen**, sondern nach der **Funktion**." },
                { title: "<a href> – Wir gehen woanders hin",
                  text: "„Ganzen Beitrag lesen“ führt zu einer **anderen Seite** – die Adresse im Browser ändert sich. Dafür nehmen wir immer `<a href=\"...\">`. Auch Sprünge zu `#anker` sind Navigation." },
                { title: "<button type=\"button\"> – Wir tun etwas auf dieser Seite",
                  text: "„Beitrag merken“ wechselt **nicht** die Seite, sondern löst eine **Aktion** aus. Dafür nehmen wir `<button type=\"button\">`. Was genau passiert, programmiert man später mit JavaScript – jetzt passiert beim Klick noch nichts." },
                { title: "Noch ein Button: Darstellung umschalten",
                  text: "Ein Schalter für ein dunkles Design ist ebenfalls eine **Aktion** → `<button>`. Faustregel: **Adresse ändert sich → `<a>`**, **Aktion auf der Seite → `<button>`**. Auch `<button>` ist inline." }
            ]
        },
        {
            id: "get", label: "3 · Formular mit GET", code: "code-get",
            components: RAHMEN.concat([{ sel: "#suche", name: "SearchForm" }, { sel: "article", name: "NewsCard" }]),
            url: "file:///lernportal/neuigkeiten.html",
            steps: [
                { base: true, title: "Ausgangspunkt",
                  text: "Bisher schickt unsere Seite nur Inhalte **zum** Browser. Mit einem **Formular** schickt der Browser Daten **an einen Server** – ganz ohne JavaScript. Wir beginnen mit einer Suche." },
                { title: "<form action method=\"GET\">",
                  text: "`<form>` ist ein Block, der alle Eingaben bündelt. `action` ist die **Adresse des Servers**, an den die Daten gehen. `method=\"GET\"` bedeutet: Die Daten werden **sichtbar an die URL** angehängt. GET verwenden wir zum **Suchen und Abfragen**." },
                { title: "<label> und <input> – id ist nicht name!",
                  text: "`<input>` ist ein **Non-Closing Tag** und inline. `<label for=\"suchbegriff\">` gehört zum Feld mit `id=\"suchbegriff\"` – ein Klick auf die Beschriftung setzt den Cursor ins Feld. **Wichtig:** `name=\"q\"` ist der **Schlüssel für den Server**. Ohne `name` wird der Wert **nicht** mitgeschickt!" },
                { title: "<button type=\"submit\"> – Absenden ausprobieren!",
                  text: "`type=\"submit\"` schickt das Formular ab. **Tippe rechts etwas ein und klicke „Suchen“.** Unten erscheint der HTTP-Request, und die Adresszeile zeigt `?q=...` – genau das ist GET: **Schlüssel=Wert** in der URL. Mit „Wirklich absenden“ geht die Suche tatsächlich an Google." }
            ]
        },
        {
            id: "post", label: "4 · Formular mit POST", code: "code-post",
            components: RAHMEN.concat([{ sel: "#anmeldung", name: "RegistrationForm" }, { sel: "fieldset", name: "RadioGroup" }]),
            url: "file:///lernportal/neuigkeiten.html",
            steps: [
                { base: true, title: "Ausgangspunkt",
                  text: "Jetzt sollen Schüler:innen ihr Diplomprojekt **anmelden**. Hier werden Daten **gespeichert** – dafür nehmen wir `POST`. Als Server verwenden wir `httpbin.org`, einen Test-Server, der uns einfach zurückzeigt, was angekommen ist." },
                { title: "<form method=\"POST\">",
                  text: "Mit `method=\"POST\"` stehen die Daten **nicht** in der URL, sondern im **Body** des HTTP-Requests. POST verwenden wir, wenn etwas **gespeichert oder verändert** wird oder die Daten nicht in der Adresszeile stehen sollen (z. B. Passwörter)." },
                { title: "Textfeld mit required",
                  text: "`type=\"text\"` ist ein einzeiliges Textfeld. Das Attribut `required` steht allein ohne Wert: Der Browser lässt das Formular erst absenden, wenn das Feld ausgefüllt ist." },
                { title: "type=\"email\" – der Browser prüft mit",
                  text: "Über das Attribut `type` wird aus demselben `<input>` ein anderes Feld. Bei `type=\"email\"` prüft der Browser vor dem Absenden, ob ein `@` vorkommt." },
                { title: "<select> und <option> – Auswahl aus einer Liste",
                  text: "`<select>` ist ein **Auswahlmenü** (Dropdown). Jede Möglichkeit ist ein `<option>`. Der Text zwischen den Tags ist für Menschen, `value=\"if\"` wird an den Server geschickt: `abteilung=if`." },
                { title: "Radio-Buttons in <fieldset> mit <legend>",
                  text: "Bei `type=\"radio\"` darf man **genau eine** Möglichkeit wählen. Alle Radio-Buttons einer Gruppe haben **denselben** `name`. `<fieldset>` fasst die Gruppe zusammen, `<legend>` ist ihre Überschrift. `checked` wählt eine Möglichkeit vor." },
                { title: "type=\"date\" – Datumsauswahl",
                  text: "Mit `type=\"date\"` zeigt der Browser einen Kalender an. Weitere Typen: `number`, `password`, `tel`, `url`, `color` … – immer dasselbe `<input>`, nur ein anderes `type`." },
                { title: "<textarea> – Mehrzeiliger Text",
                  text: "Für längere Texte nehmen wir `<textarea>`. Anders als `<input>` hat es **ein Closing-Tag** – der Text zwischen den Tags wäre der Startwert. `rows` legt die sichtbare Höhe fest." },
                { title: "Checkbox und Absenden – ausprobieren!",
                  text: "`type=\"checkbox\"` ist ein Häkchen, das man an- oder abwählen kann. **Fülle das Formular rechts aus und klicke „Anmelden“.** Der Request unten zeigt: Bei POST bleibt die URL ohne `?` – die Daten stehen im **Body**." }
            ]
        }
    ]
});
</script>
